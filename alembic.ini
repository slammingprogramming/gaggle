; Development-time config for `alembic revision --autogenerate` only.
;
; Production code (storage/migrate.py) never reads this file -- it builds
; an in-memory alembic.config.Config() with script_location resolved
; package-relative and sqlalchemy.url pointed at the real workspace's
; index.sqlite3, so migrations work the same whether gaggle is run from
; this checkout or installed via pip. This file exists purely so a
; developer can run `alembic revision --autogenerate -m "..."` from the
; repo root while authoring a new migration.

[alembic]
script_location = src/gaggle/storage/migrations
prepend_sys_path = src

; Point at a disposable scratch database when autogenerating -- never a
; real workspace. Delete/recreate it before each autogenerate run so the
; diff alembic computes reflects the schema you're actually starting
; from, not stale scratch state from a previous session.
sqlalchemy.url = sqlite:///./alembic-dev-scratch.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
