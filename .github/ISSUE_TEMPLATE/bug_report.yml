name: Bug report
description: Something isn't working the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **If this is a security
        vulnerability, stop here** and follow [SECURITY.md](../../SECURITY.md)
        instead of filing a public bug report.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands run, in order, if possible.
      placeholder: |
        1. gaggle ingest ./footage --workspace ./workspace
        2. gaggle analyze --workspace ./workspace
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >-
        Paste any relevant CLI output or traceback. This is rendered as code
        automatically. **Redact anything from your own footage/workspace**
        (paths, camera names, plate numbers, etc.) before pasting.
      render: shell
  - type: input
    id: version
    attributes:
      label: Gaggle version
      description: Output of `gaggle --version`, or the commit hash if running from source.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Docker
        - Other (specify below)
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Installed optional extras
      description: >-
        Which extras from `pip install gaggle[...]` are installed
        (vision, face_recognition, plate_recognition, transcription, cloud,
        signing, gunshot), if any.
